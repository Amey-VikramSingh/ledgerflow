services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledgerflow
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger -d ledgerflow']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # The API is optional in local dev — most days you'll run `npm run dev` on the
  # host and only bring up the dependencies:
  #     docker compose up postgres redis
  # Enable these services (profile "app") to run everything in containers:
  #     docker compose --profile app up
  # `migrate` applies pending migrations and exits; `api` and `worker` wait for it.
  migrate:
    profiles: ['app']
    build: .
    command: ['npm', 'run', 'migrate:up']
    environment:
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledgerflow
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build: .
    environment: &app-env
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledgerflow
      REDIS_URL: redis://redis:6379
      # Dev-only values (same as .env.example). Never use them in production —
      # the app refuses to start with them when NODE_ENV=production.
      JWT_SECRET: dev-only-change-me-to-a-long-random-string-min-32-chars
      SECRETS_ENCRYPTION_KEY: bGVkZ2VyZmxvdy1kZXYtb25seS1rZXktMzJieXRlcyE=
    ports:
      - '3000:3000'
    depends_on: &app-deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: ['app']
    build: .
    command: ['node', 'dist/worker.js']
    environment: *app-env
    depends_on: *app-deps

  otel-collector:
    profiles: ['obs']
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml
    ports:
      - '4318:4318'
      - '4317:4317'

  prometheus:
    profiles: ['obs']
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'

  grafana:
    profiles: ['obs']
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - '3001:3000'

volumes:
  pgdata:
