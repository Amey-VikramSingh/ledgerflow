name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledgerflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledgerflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ledger:ledger@localhost:5432/ledgerflow
      REDIS_URL: redis://localhost:6379
      SECRETS_ENCRYPTION_KEY: bGVkZ2VyZmxvdy1kZXYtb25seS1rZXktMzJieXRlcyE=

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Migrations must apply cleanly, roll all the way back, and re-apply.
      - name: Migrations up
        run: npm run migrate:up
      - name: Seed (twice — must be idempotent)
        run: npm run seed && npm run seed
      - name: Migrations down (all)
        run: npm run migrate:down -- 0
      - name: Migrations up again
        run: npm run migrate:up
