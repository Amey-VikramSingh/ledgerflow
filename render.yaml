# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Free tier: the web service sleeps after 15 minutes idle (the first request
# then takes up to ~1 minute), and the free Postgres database expires 30 days
# after creation unless upgraded.
services:
  - type: web
    name: ledgerflow-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    # Free tier has no background workers or pre-deploy step, so this one
    # container runs migrations, then the API and the webhook worker.
    dockerCommand: sh scripts/start-all.sh
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ledgerflow-redis
          property: connectionString
      # Render generates random 256-bit base64 values for these: long enough
      # for JWT_SECRET, and exactly the 32-byte key SECRETS_ENCRYPTION_KEY needs.
      - key: JWT_SECRET
        generateValue: true
      - key: SECRETS_ENCRYPTION_KEY
        generateValue: true
      - key: OTEL_ENABLED
        value: "false"

  - type: keyvalue
    name: ledgerflow-redis
    plan: free
    region: singapore
    # BullMQ needs keys never evicted; only internal connections allowed.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: ledgerflow-db
    plan: free
    region: singapore
    databaseName: ledgerflow
    user: ledger
    ipAllowList: []
